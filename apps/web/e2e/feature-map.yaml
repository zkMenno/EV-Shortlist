# Feature map (T-126): what a buyer can do on the site, how to walk it and what must be true.
# Read by scripts/verify.mjs (`pnpm --filter @ev/web verify`) and by reviewers as a grading rubric.
# Plain words on purpose: a failure prints `what` and `why`, so the report reads like a bug report.
#
# Selectors: Playwright selector strings; `@name` is short for [data-testid="name"].
# Steps (in order): goto <path> · click <sel> · fill [<sel>, <text>] · select [<sel>, <value>] ·
#   follow <sel> (click a link and wait for the new page) · wait <sel>
# Expectations: count <sel> with eq / min / max · visible <sel> · text <sel> with contains / match ·
#   attr <sel> with name + match · url with match · lang (the <html lang>).
#   Every expectation has `what` (the thing, in buyer words) and `why` (what it means if it fails).
#   `on: release` = only checked on the published release (counts that depend on how many cars we
#   have); `on: fixture` = only on the dev fixture. Default: both.
# triggers: source paths (globs from apps/web/; quote any with [[] brackets) that, when changed, make `verify --changed` walk it.
# Every run also checks, on every page it visits: no uncaught page error, no raw dictionary key
# (e.g. "hero.card.price") in the visible text, and the right <html lang>.

defaults:
  timeout_ms: 10000
  # Shared files every page uses: a change here walks every flow under `verify --changed`.
  # Paths are relative to apps/web (the root lockfile is ../../pnpm-lock.yaml).
  always_all: [package.json, ../../pnpm-lock.yaml, next.config.ts, src/proxy.ts, src/lib/csp.ts, src/lib/catalogue.ts, src/lib/format.ts, src/i18n/t.ts, src/components/Num.tsx, src/components/Term.tsx, "src/app/[[]country]/[[]lang]/layout.tsx"]

features:
  # ── Hero (T-080, launch scope §1) ───────────────────────────────────────────────────────────
  - id: hero-road-tripper
    title: "Hero: road-tripper with a budget gets a ranked top 10"
    triggers: [src/components/Hero.tsx, src/lib/shortlist.ts, src/lib/hero-state.ts, src/lib/filters.ts, src/config/shortlist-rules.generated.json, "src/app/[[]country]/[[]lang]/page.tsx", src/lib/finance*.ts, src/i18n/*.json]
    steps:
      # T-132: the budget is its own question (q=budget); "Show my top 10" opens the results.
      - goto: /nl/en?q=budget&role=only&trips=monthly&charge=home&area=town
      - click: "@hero-budget-30000"
      - click: "@hero-show"
      - wait: "@hero-card"
    expect:
      - count: "@hero-card"
        eq: 10
        on: release
        what: the top 10 cars
        why: presets, gates or the budget dropped cars it shouldn't (missing data must never drop a car, Decision 055)
      - count: "@hero-card"
        min: 1
        what: at least one ranked car
        why: the hero shows nothing for a common answer set
      - count: "@hero-shortlist @hero-card"
        min: 1
        max: 5
        what: the "Your shortlist" block (top 5)
        why: the first five aren't marked as the shortlist
      - text: "@hero-profile"
        contains: Road-tripper
        what: the profile name
        why: the picker answers don't map to the road-tripper profile
      - text: "@hero-summary"
        contains: "up to €30,000"
        what: the budget in the profile summary above the results
        why: the budget picked on the budget question didn't reach the results
      - visible: "@hero-why"
        what: the 'why it ranks here' line
        why: cards don't explain their rank
      - attr: "@hero-listings"
        name: href
        match: "^https://"
        what: the 'See listings' link
        why: the first card has no working link out to a marketplace
      - url: "budget=30000"
        what: the budget in the address bar
        why: state is not in the URL, so the link can't be shared (design principle 3)

  - id: hero-budget-question
    title: "Hero: the budget question shows quick picks and a monthly estimate"
    triggers: [src/components/Hero.tsx, src/components/HeroSteps.tsx, src/lib/hero-state.ts, src/lib/finance*.ts, src/i18n/*.json]
    steps:
      - goto: /nl/en?q=budget&role=only&trips=monthly&charge=home&area=town
      - click: "@hero-budget-30000"
    expect:
      - attr: "@hero-road [aria-current=step]"
        name: aria-current
        match: "^step$"
        what: the progress road marks the current stop
        why: the visitor can't see where they are in the questions
      - text: "@hero-stepline"
        contains: "Step 3 of 3"
        what: the step line above the question
        why: the budget question doesn't say it's the last one
      - text: "@hero-monthly"
        match: "≈ .+ a month|official typical loan rate"
        what: the monthly estimate under the budget
        why: the loan estimate (or its 'no rate' note) is missing
      - text: "@hero-trail"
        contains: Road-tripper
        what: the answers so far, collapsed into the profile name
        why: the answer trail lost the driving answers
      - url: "q=budget"
        what: the question in the address bar
        why: the back button and shared links can't return to this question

  - id: hero-daily-driver
    title: "Hero: daily driver"
    triggers: [src/components/Hero.tsx, src/lib/shortlist.ts, src/config/shortlist-rules.generated.json]
    steps:
      - goto: /nl/en?role=main&trips=never&charge=home
      - wait: "@hero-card"
    expect:
      - text: "@hero-profile"
        contains: Daily driver
        what: the profile name
        why: "'main car, never long trips' should be the daily-driver profile"
      - count: "@hero-card"
        eq: 10
        on: release
        what: the top 10 cars
        why: the daily-driver presets or gates dropped too many cars
      - count: "@hero-card"
        min: 1
        what: at least one ranked car
        why: the hero shows nothing for this profile

  - id: hero-runabout-picker
    title: "Hero: tapping through the questions as a second car builds the runabout profile"
    triggers: [src/components/Hero.tsx, src/components/HeroSteps.tsx, src/lib/shortlist.ts, src/lib/hero-state.ts]
    steps:
      # T-132: one question per screen; a second car skips the long-trips question.
      - goto: /nl/en
      - click: "label:has(@hero-country-nl)"
      - click: "label:has(@hero-role-second)"
      - click: "label:has(@hero-charge-home)"
      - click: "label:has(@hero-area-town)"
      - click: "@hero-show"
      - wait: "@hero-card"
    expect:
      - text: "@hero-profile"
        contains: Runabout
        what: the profile name after the four profile questions
        why: tapping an answer doesn't update the profile
      - url: "role=second"
        what: the answer in the address bar
        why: picker answers are not saved in the URL
      - count: "@hero-card"
        min: 1
        what: ranked cars
        why: the hero doesn't re-rank in the browser after a tap

  - id: hero-kerbside
    title: "Hero: no charger at home adds the kerbside layer"
    triggers: [src/components/Hero.tsx, src/lib/shortlist.ts, src/config/shortlist-rules.generated.json]
    steps:
      - goto: /nl/en?role=only&trips=often&charge=public_only&area=city
      - wait: "@hero-card"
    expect:
      - text: "@hero-profile"
        match: "Road-tripper · no charger at home"
        what: the stacked profile name
        why: the kerbside layer doesn't stack on the base profile
      - count: "@hero-card"
        min: 1
        what: ranked cars
        why: the kerbside presets dropped every car

  - id: hero-brand-picker
    title: "Hero: pick brands by typing, then remove one"
    triggers: [src/components/Hero.tsx, src/components/BrandPicker.tsx]
    steps:
      - goto: /nl/en?role=only&trips=monthly&charge=home&area=town
      - click: "@hero-refine summary"
      - wait: "@hero-brands-input"
      - fill: ["@hero-brands-input", "tes"]
      - wait: "@hero-brands-list"
      - click: "role=option[name=\"Tesla\"]"
    expect:
      - visible: "@hero-brands >> role=button[name=\"Remove Tesla\"]"
        what: a "Tesla ×" chip under "Only these brands"
        why: picking a brand in the list doesn't select it, or the chip to undo it is missing
      - url: "make=tesla"
        what: the brand in the page address
        why: the brand choice is lost on reload or share (filters live in the URL)

  # T-146: the results layout (T-132 parts 1 + 2): rows, "Also worth a look", the answers sidebar, Show all cars.
  - id: hero-results
    title: "Hero results: shortlist rows, 'Also worth a look', the answers sidebar and Show all cars"
    triggers: [src/components/Hero.tsx, src/components/HeroSteps.tsx, src/lib/hero-state.ts, src/lib/shortlist.ts, "src/app/[[]country]/[[]lang]/page.tsx", src/i18n/en.json]
    steps:
      - goto: /nl/en?role=main&trips=monthly&charge=home&budget=40000
      - wait: "@hero-shortlist @hero-card"
    expect:
      - count: "@hero-shortlist @hero-card"
        min: 1
        max: 5
        what: the "Your shortlist" rows (up to five priced cars)
        why: the results don't show a shortlist for a common answer set
      - text: "@hero-more"
        contains: Also worth a look
        on: release
        what: the "Also worth a look" rows after the shortlist
        why: cars six to ten are missing or unlabelled
      - visible: "@hero-side"
        what: the answers sidebar beside the results
        why: the visitor can't see what the ranking is based on
      - text: "@hero-answers"
        contains: Our main car
        what: every answer listed in the sidebar
        why: the sidebar doesn't say what the visitor picked
      - visible: "@hero-answer-trips"
        what: a change button next to each answer
        why: changing one answer means starting over
      - attr: "@hero-all-cars-link"
        name: href
        match: "/nl/en/cars\\?.*role=main.*sort=-suggested"
        what: the Show all cars link under the results
        why: the full list loses the answers or the suggested order
  - id: hero-results-edit
    title: "Hero results: a change button in the answers sidebar opens that question"
    triggers: [src/components/Hero.tsx, src/components/HeroSteps.tsx, src/lib/hero-state.ts]
    steps:
      - goto: /nl/en?role=main&trips=monthly&charge=home&budget=25000
      - wait: "@hero-answer-trips"
      - click: "@hero-answer-trips"
      - wait: "@hero-q-trips"
    expect:
      - url: "q=trips"
        what: the trips question in the address bar
        why: Back won't return to the results (every question is a history entry, T-132)
      - visible: "@hero-q-trips"
        what: the long-trips question
        why: the change button doesn't lead to the answer it names
      - text: "@hero-stepline"
        match: "\\d"
        what: the step line on the question
        why: the visitor loses track of where they are in the questions
  - id: hero-nerd
    title: "Hero: Nerd level shows how the score is built"
    triggers: [src/components/Hero.tsx, src/lib/shortlist.ts, src/lib/use-level.ts]
    steps:
      - goto: /nl/en?role=only&trips=monthly&level=nerd
      - wait: "@hero-card"
    expect:
      - text: "@hero-nerd"
        match: "Score \\d"
        what: the score table on the first card
        why: Nerd mode hides the factors behind the ranking (simple by default, nerdy on demand)

  # ── Explore (the full list under the hero) ──────────────────────────────────────────────────
  - id: explore-filter-url
    title: "Explore: a filter narrows the list and lives in the URL"
    triggers: [src/components/Explore.tsx, src/lib/filters.ts, src/lib/state.ts, src/lib/explore-data.ts, src/lib/filter-bus.ts, "src/app/[[]country]/[[]lang]/cars/**"]
    steps:
      - goto: /nl/en/cars?view=table
      - wait: "@explore-row"
      - fill: ["#f-usedMax", "25000"]
      - wait: "@filter-pill"
    expect:
      - url: "umax=25000"
        what: the used price filter in the address bar
        why: filters are not shareable (design principle 3)
      - visible: "@explore-row"
        what: at least one row in the table
        why: a common filter emptied the table
      - text: "@result-count"
        match: "\\d"
        what: the result count
        why: the count doesn't update

  - id: catalogue-popular
    title: "Landing → 'Show all cars' → catalogue, most popular first (T-130)"
    triggers: ["src/app/[[]country]/[[]lang]/cars/**", "src/app/[[]country]/[[]lang]/page.tsx", src/lib/popularity.ts, src/lib/catalogue-redirect.ts, src/config/popularity.generated.json, scripts/popularity.mjs, src/components/Explore.tsx, src/lib/state.ts, src/lib/filters.ts, src/i18n/*.json]
    steps:
      - goto: /nl/en
      - follow: "@show-all-cars-link"
      - wait: "@popular-tag"
    expect:
      - url: "/nl/en/cars"
        what: the catalogue page
        why: the landing's 'Show all cars' button doesn't lead to the full list
      - text: "h1"
        contains: All electric cars
        what: the catalogue heading
        why: the button lands on the wrong page
      - visible: "@sort-menu"
        what: the sort menu
        why: there's no way to change the order
      - text: "(//*[@data-testid='popular-tag'])[1]"
        contains: "#1 popular"
        what: the most popular car first
        why: the default order isn't popularity
      - visible: "@popular-why"
        what: the line that says what 'Most popular' means, with 'How we rank'
        why: "the ranking isn't explained (Decision 038, the owner's picks are labelled as opinion)"
      - text: "@how-we-rank"
        contains: one person's verdict
        what: the How we rank section
        why: the owner's picks aren't labelled as one person's opinion

  - id: catalogue-cards
    title: "Catalogue: one card per generation, filter pills that remove themselves (T-130 part 2)"
    triggers: [src/components/Explore.tsx, src/lib/generation-cards.ts, src/lib/filters.ts, src/lib/state.ts, src/lib/explore-data.ts, "src/app/[[]country]/[[]lang]/cars/**", src/i18n/*.json]
    steps:
      - goto: /nl/en/cars?umax=25000&winter=250
      - wait: "@filter-pill"
      - click: "(//*[@data-testid='filter-pill'])[1]"
      - wait: "@explore-card"
    expect:
      - count: "@filter-pill"
        eq: 1
        what: one filter pill left after removing the used price
        why: a pill's × doesn't remove its filter
      - url: "winter=250"
        what: the winter range filter still in the address bar
        why: removing one pill cleared the others
      - visible: "(//*[@data-testid='explore-card'])[1]//*[@data-testid='card-used']"
        what: the used price on the first card
        why: cards don't show what the car costs used where the visitor lives
      - visible: "(//*[@data-testid='explore-card'])[1]//*[@data-testid='fact-winter']"
        what: the winter range on the first card
        why: cards miss the design's three facts (winter km, summer km, km in 20 min)
      - text: "@result-count"
        match: "\\d+ of \\d+ models match"
        what: the count line in models
        why: the count doesn't say how many models match

  - id: wltp-next-to-real-range
    title: "Official WLTP range next to our real range; WLTP filter + sort (T-143, Decision 085)"
    triggers: [src/components/OfficialRange.tsx, src/components/Explore.tsx, src/components/Hero.tsx, src/lib/generation-cards.ts, src/lib/filters.ts, src/lib/state.ts, src/lib/explore-data.ts, "src/app/[[]country]/[[]lang]/ev/_components/SpecValue.tsx", src/i18n/*.json]
    steps:
      - goto: /nl/en/cars?wltp=500&sort=-wltp
      - wait: "@fact-wltp"
    expect:
      - url: "wltp=500"
        what: the WLTP filter in the address bar
        why: the filter state is lost (shared links stop working)
      - text: "(//*[@data-testid='explore-card'])[1]//*[@data-testid='fact-wltp']"
        contains: "Official (WLTP)"
        what: the 'Official (WLTP)' line on the first card
        why: cards don't show the official figure next to our real range
      - attr: "(//*[@data-testid='explore-card'])[1]//*[@data-testid='fact-wltp']"
        name: data-known
        match: "^1$"
        what: a real official figure on a card left by the WLTP filter
        why: the WLTP filter lets cars without an official figure through
      - visible: "@filter-wltp"
        what: the WLTP slider in the range filter group
        why: there's no way to filter by the official figure
      - text: "@filter-pills"
        contains: "official (WLTP)"
        what: the WLTP filter pill
        why: the active WLTP filter can't be seen or removed

  - id: explore-compare
    title: "Explore → Compare with 'differences only'"
    triggers: [src/components/Explore.tsx, src/components/CompareTray.tsx, src/components/CompareTable.tsx, src/lib/compare-store.ts, "src/app/[[]country]/[[]lang]/compare/**"]
    steps:
      - goto: /nl/en/cars?view=table
      - wait: "@compare-toggle"
      - click: "(//*[@data-testid='compare-toggle'])[1]"
      - click: "(//*[@data-testid='compare-toggle'])[2]"
      - follow: "@compare-tray a"
      - wait: "@compare-table"
      - click: "@compare-diff-toggle"
    expect:
      - url: "/nl/en/compare\\?ids=.+,.+"
        what: the compare page with both cars
        why: the tray doesn't carry the picked cars to Compare
      - count: "@compare-table thead th"
        min: 3
        what: two car columns in the table
        why: Compare lost a car
      - url: "diff=1"
        what: "'differences only' in the address bar"
        why: the toggle isn't kept in the URL

  # ── Car pages ───────────────────────────────────────────────────────────────────────────────
  - id: car-pages
    title: "Model → generation → variant pages, with sources on the numbers"
    triggers: ["src/app/[[]country]/[[]lang]/ev/**", src/components/SpecDiff.tsx, src/components/DiffOnly.tsx, src/components/Term.tsx, src/components/PriceBand.tsx, src/lib/spec-diff.ts]
    steps:
      - goto: /nl/en/cars?view=table
      - wait: "@explore-row"
      - follow: "(//*[@data-testid='explore-row'])[1]//a[contains(@href,'/ev/')]"
    expect:
      - url: "/nl/en/ev/[^/]+/[^/]+"
        what: a car page
        why: Explore rows don't link to car pages
      - visible: "h1"
        what: the car's name
        why: the car page has no heading

  - id: generation-diff-only
    title: "Generation page: 'Differences only' hides shared rows"
    triggers: ["src/app/[[]country]/[[]lang]/ev/[[]make]/[[]model]/[[]generation]/page.tsx", src/components/DiffOnly.tsx, src/components/SpecDiff.tsx, src/lib/spec-diff.ts]
    steps:
      - goto: /nl/en/ev/hyundai/ioniq-5/gen1
      - click: "@diff-only"
    expect:
      - attr: "@diff-only"
        name: aria-pressed
        match: "true"
        on: release
        what: the 'Differences only' toggle
        why: the toggle doesn't switch on
      - url: "diff=1"
        on: release
        what: the toggle in the address bar
        why: the toggle isn't kept in the URL

  # ── Levels, tooltips, theme, language ──────────────────────────────────────────────────────
  - id: tooltip
    title: "Every term has a tooltip that opens"
    triggers: [src/components/Term.tsx, src/components/use-popover.ts, src/lib/taxonomy.ts]
    steps:
      - goto: /nl/en?role=main&trips=never
      - wait: "@hero-card"
      - click: "(//*[@data-testid='hero-card'])[1]//button[starts-with(@aria-label,'About')]"
    expect:
      - visible: "[role=dialog], [role=tooltip]"
        what: the tooltip text
        why: tapping ⓘ doesn't open the explanation

  - id: theme-toggle
    title: "Light / dark theme switch"
    triggers: [src/components/ThemeToggle.tsx, src/app/globals.css, src/app/tokens.generated.css, "src/app/[[]country]/[[]lang]/layout.tsx"]
    steps:
      - goto: /nl/en
      - click: "@theme-toggle"
    expect:
      - attr: "html"
        name: data-theme
        match: "^(dark|light)$"
        what: the chosen theme on the page
        why: the theme switch does nothing

  - id: english-only
    title: "English only (Decision 082): hidden languages redirect to /{country}/en, no language picker"
    triggers: ["src/app/[[]country]/[[]lang]/layout.tsx", src/components/Switchers.tsx, src/config/countries*.ts, src/lib/lang.ts, src/proxy.ts, scripts/countries.mjs, src/config/countries.generated.json, src/i18n/**]
    steps:
      - goto: /be/fr/learn/real-range?range=300
    expect:
      - url: "/be/en/learn/real-range.*range=300"
        what: the English page with the query kept
        why: a hidden language is still served, or the redirect drops the path or filters
      - lang: en
        what: the English page
        why: the page isn't English
      - count: "role=combobox[name=/^Language$/]"
        eq: 0
        what: no language picker
        why: the picker offers a language we don't serve

  - id: country-spain-italy
    title: "Spain and Italy: picking España opens the English Spanish site with a ranked hero"
    triggers: [src/config/countries*.ts, src/components/Switchers.tsx, scripts/countries.mjs, scripts/listings.mjs, src/config/countries.generated.json]
    steps:
      - goto: /nl/en?role=only&trips=monthly&budget=30000
      - follow: "@hero-countries a[href^='/es/en']"
      - wait: "@hero-card"
    expect:
      - lang: en
        what: the English page for Spain
        why: Spain isn't served in English (Decision 082)
      - url: "/es/en.*budget=30000"
        what: the Spanish address in English with the answers kept
        why: switching country loses the hero answers or lands on a hidden language
      - count: "@hero-card"
        min: 1
        what: ranked cars for Spain
        why: the Spanish hero shows no cars
      - count: "@hero-countries a[href^='/it/en']"
        eq: 1
        what: Italy in the country step
        why: Italy can't be picked

  # ── Content pages ──────────────────────────────────────────────────────────────────────────
  - id: learn
    title: "/learn lists the guides and opens one"
    triggers: ["src/app/[[]country]/[[]lang]/learn/**", src/lib/learn.ts, src/config/learn.generated.json]
    steps:
      - goto: /nl/en/learn
      - follow: "@learn-articles a"
    expect:
      - visible: "@learn-article"
        what: a guide
        why: /learn doesn't open its guides
      - visible: "@learn-sources"
        on: release
        what: the guide's sources
        why: a guide without its sources breaks 'every number has a source'

  - id: open-data
    title: "/data offers the open data download"
    triggers: ["src/app/[[]country]/[[]lang]/data/**", src/lib/open-data.ts]
    steps:
      - goto: /nl/en/data
    expect:
      - attr: "@open-file"
        name: href
        match: "^https://github\\.com/"
        on: release
        what: the download link
        why: the open data bundle can't be downloaded
      - text: "@open-cite"
        contains: CC BY 4.0
        on: release
        what: the citation line
        why: the licence isn't stated

# Gate files: the checks and rules that judge a change (T-121, rule G-06, Decision 062).
# A PR that touches these AND other files is flagged by the gate-guard CI job.
# Owner: WS0. Changing this file is itself a gate change.
mode: enforce          # off | observe | enforce  (enforced per Decision 090, 2026-11-27)
escape_label: gate-ok  # applied by WS0 only; logged in the job summary
test_change_marker: "Test-change:"
gate_files:
  - .github/workflows/**
  - .github/pull_request_template.md
  - config/gate-files.yaml
  - REVIEW.md
  - AGENTS.md
  - "**/AGENTS.md"
  - CLAUDE.md
  - GEMINI.md
  - .agents/**
  - docs/process/rules.md
  - .githooks/**
  - scripts/gate_guard.py
  - pipeline/**/qa*.yaml
  - pipeline/**/*_params.yaml
  - audits/A-03*
  - "**/playwright.config.*"
  - "**/vitest.config.*"
  - pipeline/pyproject.toml
  - pipeline/pytest.ini
  - "**/conftest.py"
  - .github/dependabot.yml
  - config/approved_changes.yaml
test_files:
  - "**/tests/**"
  - "**/test/**"
  - "**/e2e/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/test_*.py"
weakening_patterns:
  - "\\.skip\\("
  - "\\.only\\("
  - "test\\.fixme"
  - "pytest\\.mark\\.skip"
  - "pytest\\.mark\\.xfail"
  - "@unittest\\.skip"
  - "\\btime\\.sleep\\("
  - "waitForTimeout\\("
guard_self_tests:
  - scripts/tests/test_gate_guard.py

    basis: "rdw-tgk 2026-11-26: e4*2007/46*0667 SA3 Raven Long Range (uitvoering _B_: WLTP 610 km, NEDC 632 km, 250 km/h); excludes Performance _P_ (DPS15N / EPS15N, WLTP 593 km)"

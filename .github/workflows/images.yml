name: Images

# Builds linux/arm64 images for the AppInfra server (Hetzner CAX31, Arm) and pushes them to GHCR
# (Decisions 005, 006). On main, the web image is then smoke-tested under the server's runtime
# limits and deployed to staging (staging.evshortlist.com) through AppInfra's `deploy` command
# (issue #88, AppInfra #103). Live (`ev`) is not deployed from here until Menno says "launch".
# Pull requests that touch an image's inputs build both images too, but never push (T-013 review),
# so a broken Dockerfile shows up before it reaches main.
on:
  push:
    branches: [main]
    # Note-only commits (handoffs, inboxes, docs) never build or deploy (rule G-40): each one
    # rebuilt both images and redeployed staging, and every failure emailed Menno (17 Nov).
    # Not `**/*.md`: data/releases/<n>/README.md is copied into the web image. Root `*.md`
    # (AGENTS, CHATS, BOARD, …) matches the top level only. A commit that also touches any
    # other file still builds. Manual runs (workflow_dispatch) are never filtered.
    paths-ignore:
      - "*.md"
      - docs/**
      - workstreams/**
      - tasks/**
      - research/**
      - audits/**
      - _archive/**
  pull_request:
    paths:
      - apps/web/**
      - pipeline/**
      - packages/**
      - "**/Dockerfile"
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/images.yml
  workflow_dispatch:

# Least privilege (A-02): read-only by default. Two jobs so that code from a pull request
# (or a manual run on a branch) never runs with a token that can write packages: `build`
# builds without pushing (contents: read only); `push` runs on main only and is the one job
# with packages: write. Actions are pinned to commit SHAs (tag in the comment).
permissions:
  contents: read

# Pull requests cancel their older runs. Main runs are never cancelled mid-way (a deploy is never cut
# off); GitHub keeps only the newest pending main run, so quick successive pushes deploy the newest.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests and manual runs off main: build both images, never log in, never push.
  build:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    name: build ${{ matrix.image }} (linux/arm64)
    # Native Arm runner (free for public repos): no QEMU, real arm64 Next/SWC and wheel builds.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: jobs
            dockerfile: pipeline/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Release files live only on the GitHub Release (Decision 035, T-064); git holds the manifest.
      # The web image needs every run-time file of data/releases/<latest> (T-168): fetch-release.mjs's
      # DEFAULT_FILES (catalogue, scores, used prices, charging stats) plus the photo bundle, unpacked
      # into images/. No CATALOGUE_FILES here: that list lives in one place, the script. Fetched by
      # manifest (size + sha256) into the build context first. Public download, no token.
      - if: matrix.image == 'web'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Fetch the latest release (catalogue, scores, prices, charging, photos)
        if: matrix.image == 'web'
        env:
          CATALOGUE_DIR: ${{ github.workspace }}/data/releases
        run: node apps/web/scripts/fetch-release.mjs


      # Tags: sha-<short>, the full sha (what the server pins), plus `main` for the newest main build.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # GHCR names must be lowercase, so the owner is spelled out rather than taken from github.repository_owner.
          images: ghcr.io/zkmenno/ev-finder-${{ matrix.image }}
          # Full 40-character sha: the only tag AppInfra's deploy-app.sh accepts (#88).
          tags: |
            type=sha,prefix=sha-
            type=sha,prefix=,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          # Web image: public origin for canonical / hreflang / sitemap URLs (A-05 F3). Repository
          # variable APP_URL if set; otherwise the domain AppInfra serves (#88). Staging runs the same image.
          # The jobs image ignores it.
          build-args: |
            APP_URL=${{ vars.APP_URL || 'https://evshortlist.com' }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read main's cache, never write it (keeps main's cache clean).
          cache-from: type=gha,scope=${{ matrix.image }}

  # Pushes to main (and manual runs on main): build, push to GHCR with provenance + SBOM.
  push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: push ${{ matrix.image }} (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: jobs
            dockerfile: pipeline/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Release files live only on the GitHub Release (Decision 035, T-064); git holds the manifest.
      # The web image needs every run-time file of data/releases/<latest> (T-168): fetch-release.mjs's
      # DEFAULT_FILES (catalogue, scores, used prices, charging stats) plus the photo bundle, unpacked
      # into images/. No CATALOGUE_FILES here: that list lives in one place, the script. Fetched by
      # manifest (size + sha256) into the build context first. Public download, no token.
      - if: matrix.image == 'web'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Fetch the latest release (catalogue, scores, prices, charging, photos)
        if: matrix.image == 'web'
        env:
          CATALOGUE_DIR: ${{ github.workspace }}/data/releases
        run: node apps/web/scripts/fetch-release.mjs


      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short>, the full sha (what the server pins), plus `main` for the newest main build.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # GHCR names must be lowercase, so the owner is spelled out rather than taken from github.repository_owner.
          images: ghcr.io/zkmenno/ev-finder-${{ matrix.image }}
          # Full 40-character sha: the only tag AppInfra's deploy-app.sh accepts (#88).
          tags: |
            type=sha,prefix=sha-
            type=sha,prefix=,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          # Web image: public origin for canonical / hreflang / sitemap URLs (A-05 F3). Repository
          # variable APP_URL if set; otherwise the domain AppInfra serves (#88). Staging runs the same image.
          # The jobs image ignores it.
          build-args: |
            APP_URL=${{ vars.APP_URL || 'https://evshortlist.com' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Main only: run the pushed web image the way AppInfra runs ev-staging (read-only root, user node,
  # writable only /tmp 32 MB and .next/cache 64 MB, 384 MB / 0.5 CPU, no network) and fail if it
  # is unhealthy or writes anywhere else (#88 point 3). Pulls a public image, so no token needed.
  smoke-web:
    needs: push
    name: smoke web (server runtime limits)
    runs-on: ubuntu-24.04-arm
    permissions: {}
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/zkmenno/ev-finder-web:${{ github.sha }}
      # Launch pages only: parked features (e.g. /top, Decision 051) answer 404 on purpose.
      PATHS: /health / /nl/nl /fr/fr /nl/nl/compare /nl/nl/learn /nl/nl/data /nl/nl/about /robots.txt /sitemap.xml
    steps:
      - name: Pull the pushed image
        run: docker pull "$IMAGE"

      - name: Run it read-only with the staging limits
        run: |
          set -eu
          run() {  # $1 = name, rest = extra docker flags
            name=$1; shift
            docker run -d --name "$name" "$@" --user node --network none \
              --memory 384m --memory-swap 384m --cpus 0.5 \
              --tmpfs /tmp:size=32m,mode=1777 \
              --tmpfs /app/apps/web/.next/cache:size=64m,uid=1000,gid=1000 \
              -e APP_URL=https://evshortlist.com -e STAFF_PAGES=0 -e TRIP_FIT=0 "$IMAGE"
          }
          fetch_all() {  # GETs every path inside the container (it has no network); each must end 2xx
            docker exec -e PATHS="$PATHS" "$1" node -e '
              (async () => { let bad = 0;
                for (const p of process.env.PATHS.split(" ")) {
                  const r = await fetch("http://127.0.0.1:3000" + p, { redirect: "follow" }).catch(e => ({ status: String(e) }));
                  console.log(r.status, p); if (!r.ok) bad++;
                } process.exit(bad ? 1 : 0); })()'
          }
          # T-168: the hero ranks cars and a photo is served, so a release file the app reads can't
          # silently go missing from the image again (staging said "ranking not available", 28 Nov).
          hero_check() {
            docker exec "$1" node -e '
              (async () => {
                const base = "http://127.0.0.1:3000";
                const fail = (m) => { console.log("::error::" + m); process.exit(1); };
                const html = await (await fetch(base + "/nl/en?role=main&trips=monthly&charge=home&budget=40000")).text();
                if (html.includes("data-testid=\"hero-no-scores\"")) fail("hero says ranking not available: shortlist_scores.json is missing from the image");
                if (!html.includes("data-testid=\"hero-shortlist\"")) fail("hero shows no shortlist rows");
                const photo = /\/photos\/[a-z0-9-]+\.webp/.exec(html)?.[0];
                if (!photo) fail("hero shows no photo: <release>/images/ is missing from the image");
                const r = await fetch(base + photo);
                if (r.status !== 200 || !(r.headers.get("content-type") || "").startsWith("image/webp")) fail(photo + " answered " + r.status);
                console.log("OK hero: shortlist rows and", photo);
              })()'
          }
          wait_healthy() {
            for i in $(seq 1 60); do
              docker exec "$1" node -e 'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))' && return 0
              sleep 2
            done
            docker logs "$1"; return 1
          }
          # 1) Exactly as on the server: read-only root.
          run ro --read-only
          wait_healthy ro
          fetch_all ro
          fetch_all ro   # second pass hits the warm caches
          hero_check ro
          docker logs ro > ro.log 2>&1; cat ro.log
          if grep -nE 'EROFS|EACCES|read-only file system' ro.log; then
            echo "::error::the web image tried to write outside /tmp and .next/cache"; exit 1
          fi
          # 2) Same run on a writable root: docker diff lists every path written outside the tmpfs mounts.
          run rw
          wait_healthy rw
          fetch_all rw
          fetch_all rw
          docker logs rw > rw.log 2>&1
          docker diff rw | tee diff.txt
          # On the server any of these writes would fail, so any path here fails the job.
          if grep -q . diff.txt || grep -nE 'EROFS|EACCES' rw.log; then
            echo "::error::the web image writes outside /tmp and .next/cache (see above)"; exit 1
          fi
          echo "OK: healthy, pages 2xx on a read-only root, no writes outside /tmp and .next/cache"

  # Main only: deploy the image to staging via AppInfra (#88 point 2). Secrets live in the
  # `staging` environment (Menno adds them by hand; never in a chat). The server's forced
  # `deploy` command accepts only `deploy <app> <full sha>`.
  deploy-staging:
    needs: [push, smoke-web]
    name: deploy ev-staging
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://staging.evshortlist.com
    permissions: {}
    timeout-minutes: 10
    concurrency:
      group: deploy-ev-staging
      cancel-in-progress: false
    steps:
      # Only data/releases/latest is read: the release number /health must report after the deploy.
      - name: Expected release
        id: expected
        run: |
          set -eu
          n=$(curl -fsS --max-time 10 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/data/releases/latest" | tr -d '[:space:]')
          case "$n" in ''|*[!0-9]*) echo "::error::data/releases/latest is not a number: '$n'"; exit 1;; esac
          echo "release=$n" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          for v in STAGING_SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS; do
            [ -n "$(printenv "$v")" ] || { echo "::error::secret $v is missing from the staging environment"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" deploy ev-staging "$GITHUB_SHA"

      # 200 + status ok + the release this commit ships. /health has no build id yet, so the
      # ssh deploy's exit code is what proves the new container replaced the old one.
      - name: Wait for /health to answer 200 with this release
        env:
          EXPECTED: ${{ steps.expected.outputs.release }}
        run: |
          set -eu
          for i in $(seq 1 12); do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 5 https://staging.evshortlist.com/health || true)
            echo "try $i: $code $(cat body.json 2>/dev/null || true)"
            if [ "$code" = 200 ] && jq -e --argjson n "$EXPECTED" '.status == "ok" and .release == $n' body.json >/dev/null 2>&1; then
              echo "OK: staging healthy on release $EXPECTED"; exit 0
            fi
            sleep 5
          done
          echo "::error::staging /health did not answer 200 with release $EXPECTED within 2 minutes"; exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

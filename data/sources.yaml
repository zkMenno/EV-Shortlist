# Source registry (Decision 009, provisional). One entry per source.
# status: active | active_pending_confirmation | waiting_permission | blocked
#   active_pending_confirmation (Decision 037): released now, credited, reuse terms being
#   confirmed in writing; if the answer is no, the source leaves the next release.
# hosts: what the fetcher may contact (ev_pipeline/net.py allowlist; redirects are re-checked).
#   Git-cloned sources list github.com: git does not go through net.py, but net.check_git_url
#   refuses any clone URL that is not https://github.com/<owner>/<repo> on this list (A-05 L6).
# Rule: only `active` sources with a named licence or written permission reach a public release.
#   Exception (Decision 068): `use: cited-facts` + `decision:` = single facts cited from maker
#   documents; each fact's URL host must be in `cited_hosts`. Never in the CC BY open-data bundle.
# Licences marked "(to confirm)" were not verified tonight; they stay blocked until checked.
schema: sources/v1

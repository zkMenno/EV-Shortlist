source_holds:
  - generation_id: audi-q4-e-tron-gen1
    source: openev
    names: ["40", "40 Sportback", "50", "50 Sportback", "quattro", "quattro Sportback"]
    reason: >-
      OpenEV's Q4 e-tron file is mis-modelled. Its names are one step off: MY2023 "40" / "40
      Sportback" carry the 35's figures (125 kW, 9.0 s), "50" / "50 Sportback" the 40's (RWD,
      150 kW, 8.5 s; a 50 is always quattro), "quattro" the 50 quattro's (220 kW, 6.2 s). Its
      usable battery is about 4 kWh low on every trim (48 / 73 vs Audi 51.5 / 77 / 76.6), and
      MY2024-25 records repeat MY2023 unchanged although that lineup changed (45 and 55
      quattro). Audi technical data 'Audi Q4 e-tron 35 / 40 / 50 quattro', program for Germany,
      status 04-05/2021 (media.audi.com, Audi Estonia), read 2026-11-15. Joining them to the seed
      35 / 40 / 50 quattro would replace correct seed figures with these; review instead.
  - generation_id: audi-e-tron-gt-facelift
    source: openev
    names: ["quattro", "RS"]
    reason: >-
      OpenEV's e-tron GT files for MY2024-2025 repeat the pre-update car (85 / 93.4 kWh,
      270 kW DC, 390 / 440 kW) under the old trim names. From the 2024 update Audi gives 105 kWh
      gross / 97 kWh net and 320 kW DC (data sheet 'Audi RS e-tron GT 500 kW', 09/06/2024) and
      sells S / RS / RS performance. Records that land on the facelift generation would show the
      old pack on the new car; review instead (T-145). MY2024 records with the old pack go to
      gen1 by battery evidence (shared year 2024).
  - generation_id: hyundai-ioniq-5-facelift
    source: openev
    names: ["Base", "AWD"]
    reason: >-
      T-151: OpenEV's Ioniq 5 MY2025 "Base" / "AWD" files repeat the pre-facelift car (72.6 kWh
      net / 77.4 kWh gross, 507 km WLTP, 220 kW DC). From the 2024 facelift Hyundai sells 84 kWh
      (RWD 168 kW 570 km, AWD 239 kW 546 km; Hyundai Motor Deutschland 08.08.2024, Hyundai Motor
      Czech 15.08.2024). Joined to the facelift rows they outvoted the cited WLTP and made QA flag
      usable 84 > gross 77.4; review instead. The two rows are seed rows now (same ids).

  nissan-leaf-30: "Chemistry changed from the 24 kWh pack (reported to have more nickel); not classified."
  nissan-leaf-40: "Nominal about 350 V. No active cooling: rapidgate on long trips."
  nissan-leaf-62: "Cell supplier not known to us."
  nissan-leaf3-52: "Third-generation Leaf capacities and liquid cooling are from launch reports; verify against Nissan specs."
  nissan-leaf3-75: "See nissan-leaf3-52."

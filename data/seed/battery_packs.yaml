  renault-zoe-52: "Air cooling via HVAC air (reported). Gross about 54-55 kWh reported; left out."
  dacia-spring-27: "Widely reported to have no liquid cooling, but the exact thermal setup is not known to us. Pack voltage may be below the 400v class range."

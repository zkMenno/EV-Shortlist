# Links each seed variant (data/seed/variants.yaml) to a platform, a battery pack, its voltage
# and its behaviour on 400 V DC chargers (Decision 010). Generations without seed variants get a
# generation-level default keyed `generation_id` (with `battery_pack_options` when packs differ).
# UNCHECKED, LOW-CONFIDENCE data written from model knowledge, no sources fetched. To be replaced by sourced data.
# voltage = schema $defs/VariantVoltage; charger_400v = schema $defs/Charger400vBehaviour.
# 400 V cars are mode `native` (also cars without DC charging: there is nothing to limit; the UI
# should rely on dc_peak_kw being absent). class_id is normally derived from nominal_v via
# data/taxonomy/voltage_classes.yaml; `class_override_note` allows a stated class that differs.
# Entries with `uncertain: true` must be hand-checked before relying on them.
# Validate: python3 -I data/taxonomy/validate_taxonomy.py
source: {id: seed-manual, name: "EV Finder seed (hand-entered, unchecked)", licence: CC-BY-4.0, attribution: "EV Finder contributors"}
confidence: low

# YAML anchors only; ignored by the validator and loaders.
x-anchors:
  v400: &v400 {nominal_v: not-disclosed, max_v: not-disclosed, marketing_label: not-disclosed, class_id: 400v, switchable: false}
  vnd: &vnd {nominal_v: not-disclosed, max_v: not-disclosed, marketing_label: not-disclosed, class_id: not-disclosed, switchable: false}
  native: &native {mode: native}
  egmp_booster: &egmp_booster {mode: booster, kw: 50}

